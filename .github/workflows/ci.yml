name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The same Docker images as a developer's machine: ./dev.sh is the only toolchain.
      - name: Format check
        run: make fmt-check

      - name: Clippy
        run: make lint

      # The tests that need the models skip themselves when they are not installed.
      - name: Tests
        run: make test
