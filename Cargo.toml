[workspace]
resolver = "3"
members = ["crates/engine-classify","crates/engine-core", "crates/engine-document", "crates/engine-embed", "crates/engine-extract", "crates/engine-ocr", "crates/engine-onnx", "crates/engine-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/apiservicesac/dooai-engine"
authors = ["API SERVICE SAC"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
