[package]
name = "engine-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
engine-classify = { version = "0.1.0", path = "../engine-classify" }
engine-core = { version = "0.1.0", path = "../engine-core" }
engine-document = { version = "0.1.0", path = "../engine-document" }
engine-embed = { version = "0.1.0", path = "../engine-embed" }
engine-ocr = { version = "0.1.0", path = "../engine-ocr" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
